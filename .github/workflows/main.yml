name: Vanguard Commander Generator

on:
  push:
    branches:
      - main
      
  workflow_dispatch:
    inputs:
      category:
        description: "Single category to process (leave empty for all)"
        default: ""
        required: false

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10'
      
      - name: Generate a commander
        run: python commander.py
